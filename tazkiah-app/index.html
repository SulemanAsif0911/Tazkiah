<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#FFF7F3">
<title>Cyber Tazkiah</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <img class="logo" src="icons/logo.png" alt="Cyber Hayat logo">
  <div class="brand">
    <h1>Cyber Tazkiah</h1>
    <p>Safer internet · Better lives</p>
  </div>
</header>

<main id="app">
  <section id="tab-home" class="tab on"></section>
  <section id="tab-reminders" class="tab"></section>
  <section id="tab-shield" class="tab"></section>
  <section id="tab-more" class="tab"></section>
</main>

<nav class="nav" id="nav">
  <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
  <button data-tab="reminders"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM8 8h8M8 12h6"/></svg><span>Reminders</span></button>
  <button data-tab="shield"><svg viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.4 7.5 9.5 4.3-1.1 7.500-4.900 7.500-9.500V6zM9 12l2.200 2.200L15.500 10"/></svg><span>Shield</span></button>
  <button data-tab="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.600"/><circle cx="12" cy="12" r="1.600"/><circle cx="19" cy="12" r="1.600"/></svg><span>More</span></button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheet-body"></div></div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
